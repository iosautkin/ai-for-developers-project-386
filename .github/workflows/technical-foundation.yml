name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - run: pnpm install --frozen-lockfile
      - run: pnpm codegen
      - name: Generated files are current
        run: git diff --exit-code
      - run: pnpm format
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm build:storybook
      - run: pnpm --filter @calendar/design exec playwright install --with-deps chromium
      - run: pnpm test:storybook
      - run: pnpm test:e2e
      - run: docker build -t calendar-foundation:smoke .
      - run: sh ./scripts/docker-smoke.sh calendar-foundation:smoke
