openapi: 3.0.0
info:
  title: Calendar API
  version: 1.0.0
tags: []
paths:
  /api/bookings:
    post:
      operationId: createBooking
      description: Atomically validates and creates a booking.
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: The request conflicts with the current state of the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBookingRequest'
  /api/bookings/upcoming:
    get:
      operationId: listUpcomingBookings
      description: Lists bookings whose start time is strictly later than the backend clock.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Booking'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/health:
    get:
      operationId: getHealth
      description: Reports whether the HTTP process and its SQLite dependency are ready.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/meeting-types:
    get:
      operationId: listMeetingTypes
      description: Lists all meeting types in backend-defined creation order.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MeetingType'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    post:
      operationId: createMeetingType
      description: Creates a meeting type for the configured owner.
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingType'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: The request conflicts with the current state of the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMeetingTypeRequest'
  /api/meeting-types/{meetingTypeId}:
    get:
      operationId: getMeetingType
      description: Returns one meeting type so a direct booking URL can load independently.
      parameters:
        - name: meetingTypeId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/MeetingTypeId'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingType'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/meeting-types/{meetingTypeId}/availability:
    get:
      operationId: getMeetingTypeAvailability
      description: Returns all dates and slots in the current 14-day Moscow booking window.
      parameters:
        - name: meetingTypeId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/MeetingTypeId'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailabilityResponse'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
components:
  schemas:
    ApiError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          $ref: '#/components/schemas/ApiErrorCode'
        message:
          type: string
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
      description: Common response body for every unsuccessful API operation.
    ApiErrorCode:
      type: string
      enum:
        - VALIDATION_ERROR
        - MEETING_TYPE_NOT_FOUND
        - DUPLICATE_MEETING_TYPE
        - DATE_OUTSIDE_BOOKING_WINDOW
        - SLOT_CONFLICT
        - INTERNAL_ERROR
      description: Stable machine-readable API error codes.
    AvailabilityResponse:
      type: object
      required:
        - meetingType
        - generatedAt
        - windowStartsOn
        - windowEndsOn
        - timeZone
        - dates
      properties:
        meetingType:
          $ref: '#/components/schemas/MeetingTypeSummary'
        generatedAt:
          $ref: '#/components/schemas/UtcInstant'
        windowStartsOn:
          type: string
          format: date
        windowEndsOn:
          type: string
          format: date
        timeZone:
          type: string
          enum:
            - Europe/Moscow
        dates:
          type: array
          items:
            $ref: '#/components/schemas/DateAvailability'
          minItems: 14
          maxItems: 14
      description: Self-contained availability snapshot for the current 14-day Moscow booking window.
    AvailabilitySlot:
      type: object
      required:
        - startsAt
        - endsAt
        - status
      properties:
        startsAt:
          $ref: '#/components/schemas/UtcInstant'
        endsAt:
          $ref: '#/components/schemas/UtcInstant'
        status:
          $ref: '#/components/schemas/SlotStatus'
      description: One backend-computed slot in UTC.
    Booking:
      type: object
      required:
        - id
        - owner
        - meetingType
        - startsAt
        - endsAt
        - guest
      properties:
        id:
          type: string
        owner:
          $ref: '#/components/schemas/OwnerSummary'
        meetingType:
          $ref: '#/components/schemas/MeetingTypeSummary'
        startsAt:
          $ref: '#/components/schemas/UtcInstant'
        endsAt:
          $ref: '#/components/schemas/UtcInstant'
        guest:
          $ref: '#/components/schemas/GuestDetails'
      description: Persisted booking returned to the guest and calendar owner.
    CreateBookingRequest:
      type: object
      required:
        - meetingTypeId
        - startsAt
        - guest
      properties:
        meetingTypeId:
          $ref: '#/components/schemas/MeetingTypeId'
        startsAt:
          $ref: '#/components/schemas/UtcInstant'
        guest:
          $ref: '#/components/schemas/GuestDetails'
      description: Input for an atomic booking attempt. The backend computes the end time.
    CreateMeetingTypeRequest:
      type: object
      required:
        - id
        - title
        - description
        - durationMinutes
      properties:
        id:
          $ref: '#/components/schemas/MeetingTypeId'
        title:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          minLength: 1
          maxLength: 500
        durationMinutes:
          $ref: '#/components/schemas/MeetingDurationMinutes'
      description: Input normalized and persisted by the backend when a meeting type is created.
    DateAvailability:
      type: object
      required:
        - date
        - bookable
        - slots
      properties:
        date:
          type: string
          format: date
        bookable:
          type: boolean
        reason:
          $ref: '#/components/schemas/UnbookableDateReason'
        slots:
          type: array
          items:
            $ref: '#/components/schemas/AvailabilitySlot'
      description: One Moscow calendar date and its backend-computed slots.
    FieldError:
      type: object
      required:
        - field
        - message
      properties:
        field:
          type: string
        message:
          type: string
      description: Validation failure for one request field.
    GuestDetails:
      type: object
      required:
        - name
        - email
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          maxLength: 254
          format: email
        note:
          type: string
          maxLength: 1000
      description: Guest details stored as a snapshot inside a booking.
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
      description: Infrastructure response used to verify the contract and runtime pipeline.
    MeetingDurationMinutes:
      type: number
      enum:
        - 15
        - 30
        - 45
        - 60
        - 75
        - 90
        - 105
        - 120
        - 135
        - 150
        - 165
        - 180
        - 195
        - 210
        - 225
        - 240
        - 255
        - 270
        - 285
        - 300
        - 315
        - 330
        - 345
        - 360
        - 375
        - 390
        - 405
        - 420
        - 435
        - 450
        - 465
        - 480
        - 495
        - 510
        - 525
        - 540
      description: Supported meeting duration in minutes. Every value is a multiple of 15.
    MeetingType:
      type: object
      required:
        - id
        - owner
        - title
        - description
        - durationMinutes
      properties:
        id:
          $ref: '#/components/schemas/MeetingTypeId'
        owner:
          $ref: '#/components/schemas/OwnerSummary'
        title:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          minLength: 1
          maxLength: 500
        durationMinutes:
          $ref: '#/components/schemas/MeetingDurationMinutes'
      description: Meeting type published by the calendar owner.
    MeetingTypeId:
      type: string
      minLength: 3
      maxLength: 64
      pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
      description: Identifier of a meeting type, supplied by the calendar owner.
    MeetingTypeSummary:
      type: object
      required:
        - id
        - title
        - durationMinutes
      properties:
        id:
          $ref: '#/components/schemas/MeetingTypeId'
        title:
          type: string
          minLength: 1
          maxLength: 100
        durationMinutes:
          $ref: '#/components/schemas/MeetingDurationMinutes'
      description: Meeting type fields embedded into booking responses.
    OwnerSummary:
      type: object
      required:
        - id
        - displayName
      properties:
        id:
          type: string
        displayName:
          type: string
          minLength: 1
          maxLength: 100
      description: The single configured calendar owner.
    SlotStatus:
      type: string
      enum:
        - available
        - occupied
      description: Whether a future slot may be selected. Occupied slots never reveal booking details.
    UnbookableDateReason:
      type: string
      enum:
        - WEEKEND
        - NO_SLOTS
        - PAST
      description: Why a date cannot currently accept a booking.
    UtcInstant:
      type: string
      pattern: Z$
      format: date-time
      description: RFC 3339 UTC instant serialized with the canonical Z suffix.
